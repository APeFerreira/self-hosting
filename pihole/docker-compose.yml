# More info at https://github.com/pi-hole/docker-pi-hole and https://docs.pi-hole.net/
services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      - "${PIHOLE_DNS_BIND_IP:-127.0.0.1}:53:53/tcp"
      - "${PIHOLE_DNS_BIND_IP:-127.0.0.1}:53:53/udp"
      - "${PIHOLE_WEB_BIND_IP:-127.0.0.1}:${PIHOLE_WEB_HTTP_PORT:-8080}:80/tcp"
      - "${PIHOLE_WEB_BIND_IP:-127.0.0.1}:${PIHOLE_WEB_HTTPS_PORT:-8443}:443/tcp"
    environment:
      TZ: "${TZ:-Etc/UTC}"
      WEBPASSWORD_FILE: web_password
      FTLCONF_dns_upstreams: "unbound#5335"
      # Required in bridge mode; host publication above remains restricted.
      FTLCONF_dns_listeningMode: "ALL"
    # Add WireGuard client names here so Pi-hole can resolve them inside its
    # container. Example:
    extra_hosts:
    #   - "linux-laptop:10.66.66.2"
    #   - "android-phone:10.66.66.3"
    volumes:
      - pihole-data:/etc/pihole
    secrets:
      - web_password
    networks:
      - monitor-net
    restart: unless-stopped

networks:
  monitor-net:
    external: true

volumes:
  pihole-data:

secrets:
  web_password:
    file: ./secrets/web_password
